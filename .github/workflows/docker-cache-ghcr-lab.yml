name: Docker Cache + GHCR Lab

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:

  # -----------------------------------------
  # JOB 1: Discover services under src/*
  # -----------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List services
        id: list
        run: |
          SERVICES=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "Services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  # -----------------------------------------
  # JOB 2: Build (with layer caching), one per service
  # -----------------------------------------
  build:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    outputs:
      image_name: ${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build context
        id: ctx
        run: |
          # cartservice's Dockerfile and .csproj live one level deeper
          # than the rest of the services (src/cartservice/src), so it
          # needs its own build context.
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            echo "context=src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "context=src/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image name (lowercase, GHCR requires it)
        id: generate
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${{ env.REGISTRY }}/${REPO_LC}/${{ matrix.service }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image (restore + save layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          push: false
          load: true
          tags: ${{ steps.generate.outputs.image_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save image name for later jobs
        run: echo "${{ matrix.service }}=${{ steps.generate.outputs.image_name }}" >> image-names.txt

      - name: Upload image name artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-name-${{ matrix.service }}
          path: image-names.txt
          retention-days: 1

  # -----------------------------------------
  # JOB 3: Security scan, one per service
  # -----------------------------------------
  security:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - name: Placeholder scan
        run: |
          echo "Scanning ${{ matrix.service }}"
          echo "scan_result=PASS" >> "$GITHUB_OUTPUT"
        id: scan

  # -----------------------------------------
  # JOB 4: Publish (security gate), one per service
  # -----------------------------------------
  publish:
    needs: [discover, build, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.discover.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build context
        id: ctx
        run: |
          if [ "${{ matrix.service }}" = "cartservice" ]; then
            echo "context=src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "context=src/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image name (lowercase, GHCR requires it)
        id: generate
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${{ env.REGISTRY }}/${REPO_LC}/${{ matrix.service }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR (cache hit = fast rebuild)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          push: true
          tags: ${{ steps.generate.outputs.image_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
