name: Docker Cache + GHCR Lab

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  
  # JOB 1: BUILD (with layer caching)
  
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Image Tag
        id: generate
        run: echo "image_tag=app:v1.0" >> "$GITHUB_OUTPUT"

      - name: Build image (restore + save layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.generate.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display Image Tag
        run: echo "The image is ${{ steps.generate.outputs.image_tag }}"


  # JOB 2: SECURITY
 
  security:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      scan_result: ${{ steps.scan.outputs.scan_result }}
    steps:
      - name: Security Scan
        id: scan
        run: |
          echo "Scanning image: ${{ needs.build.outputs.image_tag }}"
          echo "scan_result=PASS" >> "$GITHUB_OUTPUT"


  # JOB 3: PUBLISH (security gate)

  publish:
    needs: [build, security]
    if: needs.security.outputs.scan_result == 'PASS'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR (cache hit = fast rebuild)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
