name: Microservices Trigger CI

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
  workflow_dispatch: {}   # allow manual re-runs from the Actions tab

permissions:
  contents: read
  packages: write

# Avoid overlapping runs stepping on each other's image pushes
concurrency:
  group: microservices-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------
  # Job 1: Detect changed services
  # -------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        run: |
          # github.event.before is all-zeros on the first push to a branch
          # (and can be missing entirely on workflow_dispatch), so git diff
          # against it would fail. Fall back to comparing against the
          # previous commit, or diffing the whole tree if there isn't one.
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BEFORE=$(git rev-parse HEAD~1)
            else
              BEFORE=$(git hash-object -t tree /dev/null)  # empty tree
            fi
          fi

          SERVICES=$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | grep '^src/' \
            | cut -d'/' -f2 \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "Detected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"


  # --------------------------------------------------
  # Job 2: Call reusable workflow (matrix per service)
  # --------------------------------------------------
  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    # 🚨 IMPORTANT:
    # Reusable workflows are called at JOB level
    uses: ./.github/workflows/microservice-ci.yaml

    with:
      service: ${{ matrix.service }}
    # GITHUB_TOKEN is provided automatically to reusable workflows in the
    # same repo, so no `secrets:` block is needed for microservice-ci.yaml's
    # GHCR login step.
